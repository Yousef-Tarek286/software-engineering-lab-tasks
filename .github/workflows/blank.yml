name: Two Jobs Workflow

on:
  push:
    branches:
      - main

jobs:
  job1:
    name: Job 1
    runs-on: ubuntu-latest
    steps:
      - name: Print success message
        run: echo "job 1 successful"

  job2:
    name: Job 2
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Print success message
        run: echo "job 2 successful"
